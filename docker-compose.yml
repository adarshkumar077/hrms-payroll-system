services:
  postgres:
    image: postgres:16-alpine
    container_name: eitf-hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eitf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eitf_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-eitf_hrms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - eitf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eitf} -d ${POSTGRES_DB:-eitf_hrms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eitf-hrms-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - eitf_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eitf_postgres_data:
  eitf_redis_data:
