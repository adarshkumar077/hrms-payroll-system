# Cloudflare Tunnel ingress (reference — token-based `tunnel run` uses Zero Trust dashboard config).
# When using TUNNEL_TOKEN in docker-compose, configure Public Hostname in Cloudflare Zero Trust:
#   Subdomain: hrms (or @)
#   Domain: yourdomain.com
#   Service: http://nginx:80
#
# For config-file mode (advanced), mount this file and run:
#   cloudflared tunnel --config /etc/cloudflared/config.yml run

tunnel: ${TUNNEL_ID}
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: ${PUBLIC_HOSTNAME}
    service: http://nginx:80
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      keepAliveTimeout: 90s
  - service: http_status:404
