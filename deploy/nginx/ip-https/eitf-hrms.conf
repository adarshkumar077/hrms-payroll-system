# EITF HRMS — HTTPS by server IP (LAN / intranet, option C).
#
# Used instead of deploy/nginx/conf.d when docker-compose.ip-https.yml is active.
# Certificates (made by deploy/ip-https/make-certs.sh) are mounted at /etc/nginx/certs:
#   server.crt  server certificate (+ chain) whose SAN includes the server IP
#   server.key  its private key
#
# Port 80 only redirects to HTTPS (plus the container health check). The app is served on 443.

upstream eitf_web {
    server web:3000;
    keepalive 32;
}

upstream eitf_api {
    server api:3001;
    keepalive 32;
}

# ── Port 80: redirect everything to HTTPS ────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Container health check (docker-compose healthcheck calls http://127.0.0.1/nginx-health)
    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443: the application ────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers (HSTS, CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy and
    # Permissions-Policy for camera/geolocation attendance) are sent by the web app (Next.js) and the
    # API (helmet). Adding them here would duplicate or override them.

    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # nginx is the first and only proxy here, so it REPLACES X-Forwarded-For with the real peer
    # address. Appending ($proxy_add_x_forwarded_for) would keep a client-supplied value, and
    # because LAN clients have private IPs (which the API's TRUST_PROXY default trusts), any user
    # could fake their IP to dodge login rate limits and the IP allow-list.

    # API — same-origin /api/v1/* (Swagger is disabled by the API in production)
    location /api/ {
        proxy_pass http://eitf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Next.js web app
    location / {
        proxy_pass http://eitf_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }
}
