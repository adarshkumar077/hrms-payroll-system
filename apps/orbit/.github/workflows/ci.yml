name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests (vitest pure-logic suite)
        run: npm test

      - name: Schema sync check (schema.prisma vs schema.postgres.prisma)
        run: npx vitest run lib/schema-sync.test.ts

      - name: "Typecheck (advisory — pre-existing errors, see GAPS.md)"
        run: npx tsc --noEmit
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      DATABASE_URL: "file:./e2e-ci.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to throwaway sqlite db
        run: npx prisma db push

      - name: Seed throwaway db
        run: npm run db:seed

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright golden-path suite
        run: npx playwright test
        continue-on-error: false
